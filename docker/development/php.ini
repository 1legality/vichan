; Read source changes on every request in the local development environment.
opcache.enable=0
opcache.enable_cli=0
opcache.jit=off
opcache.jit_buffer_size=0
realpath_cache_size=0

display_errors=On
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
upload_max_filesize=10M
post_max_size=12M
max_file_uploads=5
